name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: Install tmux (for integration tests)
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Owned package format (gofmt)
        run: bash ./scripts/check-owned-format.sh
      - run: go vet ./...
      - name: Catalogue generated TypeScript
        run: go run ./internal/orgplan/gencatalog -check
      - run: go test ./...
      - name: Owned package coverage (≥ 90%)
        run: bash ./scripts/check-owned-coverage.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Build UI + cross-compile binaries
        run: make cross
      - uses: actions/upload-artifact@v6
        with:
          name: initagent-binaries
          path: dist/

  installer-unix:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Exercise Linux and macOS release fallback installers
        run: scripts/test-installers.sh

  installer-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: Exercise Windows release fallback installer
        shell: pwsh
        run: ./scripts/test-installers.ps1
