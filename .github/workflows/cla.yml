name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: >-
          github.event_name == 'pull_request_target' ||
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/pleware/initagent/blob/main/CLA.md
          branch: cla
          allowlist: pleware,dependabot[bot],github-actions[bot],renovate[bot]
          custom-notsigned-prcomment: >-
            Thank you for the pull request. initagent is source-available
            under FSL-1.1-ALv2; we need a CLA so we can ship and relicense
            contributions. Please read https://github.com/pleware/initagent/blob/main/CLA.md
            and comment exactly: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: All contributors have signed the CLA.
          lock-pullrequest-aftermerge: true
