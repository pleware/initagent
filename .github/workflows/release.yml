name: Release

# Tag a commit to cut a release:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write # needed to create the release and upload assets
  id-token: write # signed GitHub build provenance
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Build UI + cross-compile binaries
        run: make cross VERSION=${{ github.ref_name }}

      - name: Package archives
        run: |
          cd dist
          rm -f -- *.tar.gz checksums.txt
          for f in initagent_darwin_* initagent_linux_* initagent_windows_*; do
            tar -czf "$f.tar.gz" "$f"
          done
          sha256sum initagent_darwin_* initagent_linux_* initagent_windows_* > checksums.txt
          ls -la

      - name: Attest release binaries
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/initagent_darwin_*
            dist/initagent_linux_*
            dist/initagent_windows_*

      # Raw binaries (initagent_<os>_<arch>) are uploaded alongside archives so
      # the hub's installer can fetch them directly from
      # /releases/latest/download/initagent_<os>_<arch>.
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/initagent_*
            dist/checksums.txt
