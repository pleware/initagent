# Same number as CONSTRAINTS.md / check-owned-coverage.sh. Do not raise it here.
coverage:
  status:
    project:
      default:
        target: 90%
        threshold: 1%
    patch:
      default:
        target: 90%
        threshold: 1%

comment:
  layout: "reach, diff, files"
  behavior: default
  require_changes: false
