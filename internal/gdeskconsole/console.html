<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Konsola biurka initAgent · klapka serwisowa</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0d10;
        --panel: #12161b;
        --line: #232a32;
        --fg: #e6edf3;
        --muted: #7d8590;
        --accent: #4493f8;
        --bad: #f85149;
        --warn: #d29922;
        --good: #3fb950;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 12px;
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
      }

      header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
      }

      h1 {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      .hint,
      .count {
        color: var(--muted);
        font-size: 11px;
      }

      .state {
        font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
        font-size: 11px;
      }

      .right {
        display: flex;
        align-items: baseline;
        gap: 14px;
      }

      .peer {
        font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
        font-size: 11px;
        color: var(--accent);
        text-decoration: none;
        border-bottom: 1px dotted currentColor;
      }

      .state.up {
        color: var(--good);
      }

      .state.down {
        color: var(--bad);
      }

      .gate {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 10px 12px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 6px;
      }

      /* An author `display` beats the browser's own rule for `hidden`, so
         without this the token field stays on screen after it is hidden. */
      .gate[hidden] {
        display: none;
      }

      .columns {
        display: flex;
        flex: 1;
        min-height: 0;
        gap: 12px;
      }

      .col {
        display: flex;
        flex: 1;
        flex-direction: column;
        gap: 8px;
        min-width: 0;
      }

      .col.logs {
        border-left: 1px solid var(--line);
        padding-left: 12px;
      }

      textarea,
      input {
        padding: 8px 10px;
        color: inherit;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 6px;
        font: inherit;
      }

      textarea {
        min-height: 88px;
        resize: vertical;
      }

      input {
        flex: 1;
        font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
      }

      textarea:focus-visible,
      input:focus-visible,
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      button {
        padding: 6px 12px;
        color: #06121f;
        background: var(--accent);
        border: 0;
        border-radius: 6px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      button:disabled {
        color: var(--muted);
        background: var(--panel);
        border: 1px solid var(--line);
        cursor: default;
      }

      .count.over {
        color: var(--bad);
      }

      h2 {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      ol {
        flex: 1;
        overflow-y: auto;
        margin: 0;
        padding: 0;
        list-style: none;
        font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
        font-size: 11px;
      }

      li {
        padding: 5px 0;
        border-bottom: 1px solid var(--line);
        overflow-wrap: anywhere;
      }

      li .at,
      li .id {
        color: var(--muted);
      }

      li .id {
        display: block;
      }

      li.bad {
        color: var(--bad);
      }

      li.warn {
        color: var(--warn);
      }

      li.mine {
        color: var(--accent);
      }

      .empty {
        color: var(--muted);
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Konsola biurka</h1>
      <div class="right">
        <a class="peer" id="peer" hidden target="_blank" rel="noreferrer noopener"></a>
        <span class="state" id="state">łączę…</span>
      </div>
    </header>

    <div class="gate" id="gate" hidden>
      <p class="hint" id="gate-why">
        Brak tokenu. Otwórz link, który łącznik wypisał przy starcie, albo wklej token tutaj.
      </p>
      <div class="row">
        <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="token biurka" />
        <button id="use" type="button">Połącz</button>
      </div>
    </div>

    <div class="columns">
      <section class="col" aria-label="Wypowiedź">
        <label class="hint" for="say">Powiedz coś do biurka</label>
        <textarea id="say" autofocus placeholder="np. opony"></textarea>

        <div class="row">
          <span class="count" id="count"></span>
          <button id="send" type="button" disabled>Wyślij — Ctrl+Enter</button>
        </div>

        <h2>Szew — fakty na tym strumieniu</h2>
        <ol id="log">
          <li class="empty">Nic jeszcze nie przyszło.</li>
        </ol>
      </section>

      <section class="col logs" aria-label="Logi łącznika">
        <h2>Logi łącznika</h2>
        <p class="hint" id="logs-hint">ostatnie zdarzenia</p>
        <ol id="sys">
          <li class="empty">Jeszcze nic nie zapisano.</li>
        </ol>
      </section>
    </div>

    <script>
      // Everything about the wire comes from Go, so this page cannot drift from
      // the seam it talks to: routes, envelope version, verbs, the ceiling on a
      // sentence, and how far back the log window reaches.
      const WIRE = {{.}}

      const TOKEN_KEY = 'initagent-gdesk-console-token'
      const MAX_LINES = 200
      const MAX_SYS = 80
      const POLL_MS = 1000
      const SWEEP_MS = 15 * 1000
      const RETRY_MS = 2000
      // Three closes with nothing received means the desk is refusing us, and
      // the likeliest reason is the token. Retrying for ever would leave a
      // person watching a page that never says why.
      const MAX_SILENT_CLOSES = 3

      const state = document.getElementById('state')
      const peer = document.getElementById('peer')
      const gate = document.getElementById('gate')
      const gateWhy = document.getElementById('gate-why')
      const tokenBox = document.getElementById('token')
      const use = document.getElementById('use')
      const box = document.getElementById('say')
      const send = document.getElementById('send')
      const count = document.getElementById('count')
      const log = document.getElementById('log')
      const sys = document.getElementById('sys')

      let token = ''
      let ws = null
      let seen = 0
      let sent = 0
      let silentCloses = 0
      let heard = false
      let logSeq = 0
      const run = Math.random().toString(36).slice(2, 8)

      document.getElementById('logs-hint').textContent =
        'ostatnie ' + Math.round(WIRE.logMaxAgeMs / 60000) + ' minut'

      /**
       * The token arrives in the fragment, which the browser does not send to
       * the server. It is copied into this tab's storage so a reload works, and
       * removed from the address bar: the link is for opening the hatch, not
       * for leaving a key in it.
       */
      function claimToken() {
        const hash = location.hash.replace(/^#/, '')
        const found = new URLSearchParams(hash).get('t')
        if (found) {
          sessionStorage.setItem(TOKEN_KEY, found)
          history.replaceState(null, '', location.pathname)
          return found
        }
        return sessionStorage.getItem(TOKEN_KEY) ?? ''
      }

      function says(text, tone) {
        state.textContent = text
        state.className = 'state' + (tone ? ' ' + tone : '')
      }

      function askForToken(why) {
        gate.hidden = false
        if (why) gateWhy.textContent = why
        tokenBox.focus()
      }

      function refresh() {
        const length = box.value.trim().length
        const over = length > WIRE.maxChars
        count.textContent = length + ' / ' + WIRE.maxChars
        count.classList.toggle('over', over)
        send.disabled = !ws || ws.readyState !== WebSocket.OPEN || length === 0 || over
      }

      function prepend(list, line, max) {
        const empty = list.querySelector('.empty')
        if (empty) empty.remove()
        list.prepend(line)
        while (list.children.length > max) list.lastElementChild.remove()
      }

      function line(text, id, className) {
        const el = document.createElement('li')
        if (className) el.className = className
        const when = document.createElement('span')
        when.className = 'at'
        when.textContent = new Date().toLocaleTimeString('pl-PL') + '  '
        // The words live in their own span so a streamed reply can keep
        // growing one line instead of printing a line per chunk.
        const body = document.createElement('span')
        body.className = 'body'
        body.textContent = text
        el.append(when, body)
        if (id) {
          const tag = document.createElement('span')
          tag.className = 'id'
          tag.textContent = id
          el.append(tag)
        }
        return el
      }

      function note(text, id, className) {
        prepend(log, line(text, id, className), MAX_LINES)
      }

      // A reply arrives as many small chunks. One line per chunk is the honest
      // rendering of the wire and useless to read, so chunks for one surface
      // grow a single line instead. Everything else is named by kind and id,
      // because an operator is asking "did it come at all", not "what shape".
      const growing = new Map()

      function chunkOf(event) {
        const chunk = event.payload?.chunk
        if (typeof chunk !== 'string' || chunk === '') return null
        const id = event.payload?.id
        return typeof id === 'string' && id !== '' ? { id: id, text: chunk } : null
      }

      function grow(event, piece) {
        const held = growing.get(piece.id)
        if (held && held.isConnected) {
          held.querySelector('.body').textContent += piece.text
          return
        }
        const el = line(piece.text, piece.id + '  #' + event.seq)
        growing.set(piece.id, el)
        prepend(log, el, MAX_LINES)
      }

      function named(event) {
        const id = event.payload?.id ?? event.payload?.surface?.id ?? ''
        // The last chunk of a reply carries no words, only `done`. Saying so is
        // the difference between "the answer ended" and "a chunk went missing".
        const done = event.payload?.done === true ? ' (koniec)' : ''
        const text = id ? event.kind + done + '  ' + id : event.kind + done
        note('#' + event.seq + '  ' + text, event.inReplyTo ?? '')
      }

      function fact(event) {
        if (typeof event.seq !== 'number' || event.seq <= seen) return
        seen = event.seq
        heard = true
        const piece = chunkOf(event)
        if (piece) grow(event, piece)
        else named(event)
      }

      function command(kind, payload) {
        sent += 1
        ws.send(
          JSON.stringify({
            v: WIRE.version,
            cmdId: 'cmd-' + run + '-' + sent,
            stream: WIRE.stream,
            kind: kind,
            payload: payload,
          }),
        )
      }

      function say() {
        const text = box.value.trim()
        if (!text || !ws || ws.readyState !== WebSocket.OPEN) return
        const utteranceId = 'utt-' + run + '-' + (sent + 1)
        command(WIRE.utteranceKind, { utteranceId: utteranceId, text: text, source: WIRE.source })
        note('▸ ' + text, utteranceId, 'mine')
        box.value = ''
        refresh()
      }

      function connect() {
        if (!token) {
          says('bez tokenu', 'down')
          askForToken()
          return
        }
        gate.hidden = true
        const url = new URL(WIRE.seamPath, location.href)
        url.protocol = location.protocol === 'https:' ? 'wss:' : 'ws:'
        url.searchParams.set('token', token)
        url.searchParams.set('stream', WIRE.stream)

        heard = false
        ws = new WebSocket(url)

        ws.onopen = () => {
          says('połączono · ' + WIRE.stream, 'up')
          // Ask for whatever happened before this tab existed, and after a drop
          // only for the gap: the seam numbers each stream separately and
          // replays from a point we name.
          command(WIRE.resyncKind, { fromSeq: seen })
          refresh()
        }

        ws.onmessage = (message) => {
          try {
            fact(JSON.parse(message.data))
          } catch {
            note('✕ nieczytelna ramka', '', 'bad')
          }
        }

        ws.onclose = () => {
          ws = null
          refresh()
          if (!heard) silentCloses += 1
          else silentCloses = 0
          if (silentCloses >= MAX_SILENT_CLOSES) {
            says('odrzucone', 'down')
            sessionStorage.removeItem(TOKEN_KEY)
            token = ''
            askForToken('Biurko zamyka połączenie bez słowa — najczęściej to zły token. Wklej go jeszcze raz.')
            return
          }
          says('rozłączono — wracam', 'down')
          setTimeout(connect, RETRY_MS)
        }
      }

      function sysLine(entry) {
        if (!entry || typeof entry !== 'object') return
        if (typeof entry.seq === 'number') {
          if (entry.seq <= logSeq) return
          logSeq = entry.seq
        }
        const at = entry.at ? new Date(entry.at) : new Date()
        const at_ms = at.getTime()
        // A dump taken right after a restart can carry lines from before the
        // window. Printing them and sweeping them a moment later would make the
        // column flicker on open.
        if (Number.isFinite(at_ms) && Date.now() - at_ms > WIRE.logMaxAgeMs) return
        const el = line(String(entry.text ?? ''), '', entry.level === 'error' ? 'bad' : entry.level === 'warn' ? 'warn' : '')
        el.dataset.atMs = String(Number.isFinite(at_ms) ? at_ms : Date.now())
        el.firstElementChild.textContent = at.toLocaleTimeString('pl-PL') + '  '
        prepend(sys, el, MAX_SYS)
      }

      // The connector's ring already forgets past the window, and so does this
      // list: a rendered column is state of its own, and nothing re-renders it
      // on a quiet desk.
      function sweep() {
        const cutoff = Date.now() - WIRE.logMaxAgeMs
        for (const el of Array.from(sys.children)) {
          const at = Number(el.dataset.atMs)
          if (Number.isFinite(at) && at < cutoff) el.remove()
        }
        if (sys.children.length === 0) {
          const empty = document.createElement('li')
          empty.className = 'empty'
          empty.textContent = 'Nic z ostatnich ' + Math.round(WIRE.logMaxAgeMs / 60000) + ' minut.'
          sys.append(empty)
        }
      }

      // Where the desktop is cannot be configured here, and a packaged glass has
      // no address to configure, so the only truthful source is the origin of a
      // browser that actually joined the seam. The desk hands back one entry per
      // stream; ours is not a link to offer, and anything that is not a plain
      // http(s) origin is not one either.
      function showPeers(list) {
        const found = (Array.isArray(list) ? list : []).find(
          (p) =>
            p &&
            p.stream !== WIRE.stream &&
            typeof p.origin === 'string' &&
            /^https?:\/\/[^/?#]+$/.test(p.origin),
        )
        if (!found) {
          peer.hidden = true
          return
        }
        peer.href = found.origin
        peer.textContent = 'pulpit · ' + found.origin.replace(/^https?:\/\//, '')
        peer.title =
          found.stream +
          ' · otwiera się w nowej karcie — kopia bez żywego szwu, z czerwonym znaczkiem w narożniku'
        peer.hidden = false
      }

      async function pollLogs() {
        if (!token) return
        try {
          const url = new URL(WIRE.logsPath, location.href)
          url.searchParams.set('token', token)
          const response = await fetch(url, { cache: 'no-store' })
          if (!response.ok) return
          const dump = await response.json()
          for (const entry of dump.lines ?? []) sysLine(entry)
          showPeers(dump.peers)
        } catch {
          // The desk is down or restarting; the socket says so louder. The link
          // goes with it: a desktop with no desk behind it opens onto nothing.
          peer.hidden = true
        }
      }

      box.addEventListener('input', refresh)
      box.addEventListener('keydown', (event) => {
        if (event.key !== 'Enter') return
        if (!event.ctrlKey && !event.metaKey) return
        event.preventDefault()
        say()
      })
      send.addEventListener('click', say)

      use.addEventListener('click', () => {
        const typed = tokenBox.value.trim()
        if (!typed) return
        tokenBox.value = ''
        sessionStorage.setItem(TOKEN_KEY, typed)
        token = typed
        silentCloses = 0
        says('łączę…')
        connect()
      })
      tokenBox.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') use.click()
      })

      token = claimToken()
      refresh()
      connect()
      pollLogs()
      setInterval(pollLogs, POLL_MS)
      setInterval(sweep, SWEEP_MS)
    </script>
  </body>
</html>
